<style>
/* Layout: nautical-chart bulletin. Masthead, risk strip, three radar sections in a single reading column. */
:root{
  --paper:#0A1424; --surface:#111F36; --ink:#E6ECF4; --muted:#93A4BC; --rule:#22344F;
  --accent:#4FB3B5; --accent-ink:#0A1424;
  --r1:#5BBF83; --r2:#E2A847; --r3:#F07A5A; --r4:#F0627A;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"PingFang SC","Noto Serif SC",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{background:var(--paper)}
.mast{background:linear-gradient(180deg,#0E1C33 0%,var(--paper) 100%)}

body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Masthead */
.mast{display:flex;flex-direction:column;gap:14px;padding-block:28px 18px;border-bottom:3px double var(--rule)}
.mast-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:.92;letter-spacing:-.01em;margin:0;text-transform:uppercase}
.brand span{color:#3FB6F0}
.brandrow{display:flex;align-items:center;gap:12px}
.logo{width:clamp(44px,10vw,64px);height:auto;flex:none}
.tagline{font-family:var(--display);font-stretch:90%;font-weight:500;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.langs{display:flex;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--surface)}
.langs button{font:600 .78rem var(--mono);border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.meta strong{color:var(--ink);font-weight:600}
.meta select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:4px 6px}

/* Risk strip */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-block:20px 6px}
.gauge{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px}
.gauge:hover{border-color:var(--accent)}
.g-name{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.bars i{height:6px;border-radius:2px;background:var(--rule)}
.g-level{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
@media (max-width:520px){.strip{grid-template-columns:1fr}}

/* Radar sections */
.radar{padding-block:30px 8px;border-bottom:1px solid var(--rule)}
.r-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:8px}
.r-kicker{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.chip{font:600 .72rem var(--mono);padding:3px 8px;border-radius:4px;color:var(--paper);background:var(--lv)}
h2{font-family:var(--display);font-stretch:88%;font-weight:700;font-size:clamp(1.35rem,4vw,1.85rem);line-height:1.15;margin:0 0 14px;text-wrap:balance}
ul.facts{margin:0 0 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.facts li{padding-left:22px;position:relative;max-width:68ch}
ul.facts li::before{content:"";position:absolute;left:4px;top:.62em;width:8px;height:8px;border:2px solid var(--accent);transform:rotate(45deg)}
.horizons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.h{border-top:2px solid var(--ink);padding-top:8px}
.h-label{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px}
.h p{margin:0;font-size:.95rem}
@media (max-width:600px){.horizons{grid-template-columns:1fr}}
.action{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:6px;padding:12px 14px;margin-bottom:14px}
.action p{margin:0;font-size:.95rem}
.sectors{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.sectors .lbl{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-right:4px}
.sectors span.s{font-family:var(--mono);font-size:.74rem;border:1px solid var(--rule);border-radius:999px;padding:2px 9px}
details{font-size:.86rem;margin-bottom:10px}
summary{cursor:pointer;font-family:var(--mono);font-size:.76rem;color:var(--muted)}
details ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
details a{word-break:break-word}

footer{padding-top:24px;display:flex;flex-direction:column;gap:10px;font-size:.86rem;color:var(--muted)}
.sig{font-family:var(--display);font-stretch:90%;color:var(--ink)}
.sig b{font-weight:700}
.status{padding:40px 0;color:var(--muted);font-family:var(--mono);font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.radar{animation:rise .5s ease both}.radar:nth-child(2){animation-delay:.06s}.radar:nth-child(3){animation-delay:.12s}}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{font:700 .86rem var(--display);font-stretch:90%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.help{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin-top:10px;font-size:.92rem}
.help p{margin:4px 0}
.vid{display:inline-flex;margin:0 0 14px}
.gloss{padding-block:26px 6px}
.gloss h3{font-family:var(--display);font-stretch:85%;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.gloss dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:.92rem}
.gloss dt{font-family:var(--mono);font-weight:600}
.gloss dd{margin:0;color:var(--ink)}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
</style>
</head>

    s.append(el("h2",null,c.title));
    if(ed.videos&&ed.videos[k]){const v=el("a","btn ghost vid",t.vid); v.href="https://www.youtube.com/shorts/"+ed.videos[k]; v.target="_blank"; v.rel="noopener"; s.append(v);}
    const ul=el("ul","facts"); c.bullets.forEach(x=>ul.append(el("li",null,x))); s.append(ul);
    const hz=el("div","horizons");
    [[t.short,c.short],[t.medium,c.medium]].forEach(([l,v])=>{const d=el("div","h"); d.append(el("p","h-label",l),el("p",null,v)); hz.append(d);}); s.append(hz);
    const ac=el("div","action"); ac.append(el("p","h-label",t.act[k]),el("p",null,c.action)); s.append(ac);
    const se=el("div","sectors"); se.append(el("span","lbl",t.sec)); c.sectors.forEach(x=>se.append(el("span","s",x))); s.append(se);
    const src=(ed.sources||[]).filter(x=>x.radar===k);
    if(src.length){const d=el("details"); d.append(el("summary",null,`${t.src} (${src.length})`)); const ol=el("ol");
      src.forEach(x=>{const li=el("li"); const a=el("a",null,x.title); a.href=x.url; a.target="_blank"; a.rel="noopener"; li.append(a); ol.append(li);}); d.append(ol); s.append(d);}
    main.append(s);});
  const txt=JSON.stringify(ORDER.map(k=>ed.radars[k]&&(ed.radars[k][lang]||ed.radars[k].pt)));
  const li=["pt","es","en","zh"].indexOf(lang); const found=Object.keys(GL).filter(w=>new RegExp("(^|[^A-Za-z])"+w+"([^A-Za-z]|$)").test(txt));
  if(found.length){const g=el("section","gloss"); g.append(el("h3",null,t.gl)); const dl=el("dl");
    found.forEach(w=>{dl.append(el("dt",null,w),el("dd",null,GL[w][li]));}); g.append(dl); main.append(g);}
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l; try{localStorage.setItem("mt-lang",lang)}catch(e){} render();}));
let deferred=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;});
$("b-inst").addEventListener("click",async()=>{
  if(deferred){deferred.prompt(); try{await deferred.userChoice;}catch(e){} deferred=null; return;}
  const h=$("help"); h.innerHTML=T[lang].hi; h.hidden=!h.hidden;});
$("b-share").addEventListener("click",async()=>{
  const url=location.href.split("#")[0], msg=T[lang].msg;
  if(navigator.share){try{await navigator.share({title:"Global Tendencies",text:msg,url});return;}catch(e){}}
  window.open("https://wa.me/?text="+encodeURIComponent(msg+" "+url),"_blank","noopener");});
$("pick").addEventListener("change",e=>{idx=+e.target.value; render(); window.scrollTo({top:0});});
$("status").textContent=T[lang].load; render();
fetch("editions.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0; return r.json();}).then(d=>{
  d.editions.sort((a,b)=>b.date.localeCompare(a.date)); DATA=d; idx=0; render();
  if(location.hash){const x=document.getElementById(location.hash.slice(1)); if(x)x.scrollIntoView();}
}).catch(()=>{$("main").innerHTML=""; $("main").append(el("p","status",T[lang].err));});
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
